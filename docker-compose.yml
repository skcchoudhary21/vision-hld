services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./docker-compose-postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  approval-engine:
    build: ./approval-engine
    ports: ["8081:8081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/approval?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: approval
      SPRING_DATASOURCE_PASSWORD: approval
      BANKING-SERVICE_WEBHOOK-URL: http://banking-service:8080/internal/events
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  banking-service:
    build: ./banking-service
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: banking
      APPROVAL-ENGINE_BASE-URL: http://approval-engine:8081
      UI_ALLOWED-ORIGIN: http://localhost:3000
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      approval-engine:
        condition: service_started

  approval-console-ui:
    build:
      context: ./approval-console-ui
      args:
        # Baked into the built JS bundle and called from the reviewer's
        # browser, so this must be the host-published address of
        # banking-service, not its in-network service name.
        VITE_API_BASE_URL: http://localhost:8080
    ports: ["3000:80"]
    depends_on:
      banking-service:
        condition: service_started

volumes:
  redis-data:
