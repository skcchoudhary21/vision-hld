server:
  port: 8080
spring:
  application:
    name: banking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: banking
    password: banking
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
approval-engine:
  base-url: http://localhost:8081
transfer:
  approval-sla-seconds: 300 # un-actioned request expires 5 minutes after submission
