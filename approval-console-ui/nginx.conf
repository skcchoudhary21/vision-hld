server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        # React Router owns client-side routes like /requests/:id -- any path
        # nginx can't find as a file falls back to index.html so the SPA's own
        # router can handle it, instead of nginx returning a bare 404.
        try_files $uri /index.html;
    }
}
