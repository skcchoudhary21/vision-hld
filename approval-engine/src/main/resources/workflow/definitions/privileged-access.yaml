name: privileged-access
version: 1
initialState: SUBMITTED
terminalStates: [APPROVED, REJECTED, EXPIRED]

states:
  - id: SUBMITTED
    label: Submitted
  - id: SECURITY_REVIEW
    label: Security Review
  - id: MANAGER_APPROVAL
    label: Manager Approval
  - id: COMPLIANCE_REVIEW
    label: Compliance Review
  - id: APPROVED
    label: Approved
  - id: REJECTED
    label: Rejected
  - id: EXPIRED
    label: Expired

transitions:
  - name: submit
    from: SUBMITTED
    to: SECURITY_REVIEW
    guards: []
  - name: approve
    from: SECURITY_REVIEW
    to: MANAGER_APPROVAL
    guards: [approvals_satisfied, actor_is_not_maker]
    allowedRoles: [SECURITY_CHECKER]
    requiredApprovals: 1
  - name: approve
    from: MANAGER_APPROVAL
    to: COMPLIANCE_REVIEW
    guards: [approvals_satisfied, actor_is_not_maker]
    allowedRoles: [MANAGER_CHECKER]
    requiredApprovals: 1
  - name: approve
    from: COMPLIANCE_REVIEW
    to: APPROVED
    guards: [approvals_satisfied, actor_is_not_maker]
    allowedRoles: [COMPLIANCE_CHECKER]
    requiredApprovals: 1
  - name: reject
    from: SECURITY_REVIEW
    to: REJECTED
    allowedRoles: [SECURITY_CHECKER]
  - name: reject
    from: MANAGER_APPROVAL
    to: REJECTED
    allowedRoles: [MANAGER_CHECKER]
  - name: reject
    from: COMPLIANCE_REVIEW
    to: REJECTED
    allowedRoles: [COMPLIANCE_CHECKER]
  - name: expire
    from: SECURITY_REVIEW
    to: EXPIRED
    guards: [sla_expired]
  - name: expire
    from: MANAGER_APPROVAL
    to: EXPIRED
    guards: [sla_expired]
  - name: expire
    from: COMPLIANCE_REVIEW
    to: EXPIRED
    guards: [sla_expired]

events:
  APPROVED: [ApprovalApproved]
  REJECTED: [ApprovalRejected]
  EXPIRED: [ApprovalExpired]
