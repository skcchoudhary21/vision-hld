name: transfer-approval
version: 1
initialState: SUBMITTED
terminalStates: [APPROVED, REJECTED, CANCELLED, EXPIRED]

states:
  - id: SUBMITTED
    label: Submitted
  - id: PENDING_APPROVAL
    label: Pending Approval
  - id: APPROVED
    label: Approved
  - id: REJECTED
    label: Rejected
  - id: CANCELLED
    label: Cancelled
  - id: EXPIRED
    label: Expired

transitions:
  - name: auto_approve
    from: SUBMITTED
    to: APPROVED
    guard: no_approval_required
  - name: require_approval
    from: SUBMITTED
    to: PENDING_APPROVAL
    guard: approval_required
  - name: approve
    from: PENDING_APPROVAL
    to: APPROVED
    guard: approvals_satisfied
  - name: reject
    from: PENDING_APPROVAL
    to: REJECTED
    guard: actor_is_eligible_checker
  - name: cancel
    from: PENDING_APPROVAL
    to: CANCELLED
    guard: actor_is_maker
  - name: expire
    from: PENDING_APPROVAL
    to: EXPIRED
    guard: sla_expired

events:
  APPROVED: [ApprovalApproved]
  REJECTED: [ApprovalRejected]
  CANCELLED: [ApprovalCancelled]
  EXPIRED: [ApprovalExpired]
